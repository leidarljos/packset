[package]
name = "packset-mcp"
description = "Model Context Protocol server over a pack: what this seat knows, and what its claims cite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "packset-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
packset-client = { path = "../packset-client", version = "0.9.0" }
rmcp = { version = "3.2", features = ["server", "transport-io", "transport-async-rw", "macros"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
