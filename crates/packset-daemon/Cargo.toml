[package]
name = "packset-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "The loopback pack writer: one process, every client"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/packset-v{ version }-{ target }.tar.gz"
bin-dir = "packset-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "packsetd"
path = "src/main.rs"

[lib]
name = "packset_daemon"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
heed = "0.20"
# serde_json carries preserve_order, so its map type is the one to keep a
# proposal log in insertion order without a second sort.
indexmap = "2"
packset-core = { path = "../packset-core", version = "0.9.0" }
serde.workspace = true
serde_json.workspace = true
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"
packset-client = { path = "../packset-client", version = "0.9.0" }
ureq = { version = "2", default-features = false, features = ["json"] }
