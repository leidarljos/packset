[package]
name = "packset"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Standing memory: Remember and Prefer only. Binary name packset."

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/packset-v{ version }-{ target }.tar.gz"
bin-dir = "packset-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "packset"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
libc = "0.2"
packset-client = { path = "../packset-client", version = "0.9.0" }
serde_json.workspace = true
packset-core = { path = "../packset-core", version = "0.9.0" }

[dev-dependencies]
tempfile = "3"
