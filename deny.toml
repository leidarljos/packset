# Advisories with no fix to take. milli is pinned to v0.41.3, the last tag
# of a repository archived on 2023-04-04, so nothing it pulls in can move.
[advisories]
ignore = [
    { id = "RUSTSEC-2023-0089", reason = "2026-11-03: atomic-polyfill, through milli v0.41.3 (rstar, heapless); no release of either drops it" },
    { id = "RUSTSEC-2025-0141", reason = "2026-11-03: bincode 1.3.3, through milli v0.41.3 (heed 0.12, charabia's lindera); packset's own heed builds without it" },
    { id = "RUSTSEC-2021-0153", reason = "2026-11-03: encoding, through milli v0.41.3 (charabia's lindera 0.23)" },
    { id = "RUSTSEC-2025-0057", reason = "2026-11-03: fxhash, used by milli v0.41.3 and its jieba-rs" },
    { id = "RUSTSEC-2026-0215", reason = "2026-11-03: smallstr, used by milli v0.41.3" },
    { id = "RUSTSEC-2026-0249", reason = "2026-11-03: smartstring, used by milli v0.41.3" },
    { id = "RUSTSEC-2024-0436", reason = "2026-11-03: paste, a build-time macro crate that tokenizers 0.23.2 requires; fastembed 7.5.0, the latest, still uses that tokenizers" },
]

# Licenses the workspace is allowed to depend on.

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    # The manifest says LGPL-2.0, which is not an SPDX identifier. The
    # crate ships no license file. 2.0-only is the identifier that string
    # used to mean, and it is accepted only for this crate.
    { allow = ["LGPL-2.0-only"], crate = "concat-arrays" },
]

[[licenses.clarify]]
crate = "concat-arrays"
expression = "LGPL-2.0-only"
license-files = [{ path = "Cargo.toml.orig", hash = 0xd75a34b2 }]

# milli 0.41.3 is a git workspace. The license is the MIT text at the
# repository root; the member manifests do not repeat it.
[[licenses.clarify]]
crate = "milli"
expression = "MIT"
license-files = [{ path = "../LICENSE", hash = 0xa8b3d205 }]

[[licenses.clarify]]
crate = "filter-parser"
expression = "MIT"
license-files = [{ path = "../LICENSE", hash = 0xa8b3d205 }]

[[licenses.clarify]]
crate = "flatten-serde-json"
expression = "MIT"
license-files = [{ path = "../LICENSE", hash = 0xa8b3d205 }]

[[licenses.clarify]]
crate = "json-depth-checker"
expression = "MIT"
license-files = [{ path = "../LICENSE", hash = 0xa8b3d205 }]

# A `*` version requirement fails the check. The milli dependency is a
# git tag with no version field, which this check calls a wildcard.
# packset-milli is unpublished, so a path or git requirement is allowed
# through. Duplicate versions stay a warning. On 2026-11-03, setting
# multiple-versions to deny failed the check: milli v0.41.3 keeps older
# releases beside newer ones.
[bans]
wildcards = "deny"
allow-wildcard-paths = true

# crates.io is the allowed registry. The allowed git repositories are
# the three milli v0.41.3 pulls in. heed 0.12.4 and lmdb-rkv-sys come
# in through that pin. Any other registry or git repository fails the
# check.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/meilisearch/milli",
    "https://github.com/meilisearch/heed",
    "https://github.com/meilisearch/lmdb-rs",
]
