name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      # A tag publish is a release of this crate. The tag's v prefix is not
      # part of the crate version. A branch dispatch has no tag to compare.
      - name: The tag matches the crate version
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          ver=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$ver" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match crate version ${ver}" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth
      - name: Publish packset crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          for p in packset-core packset-client packset-embed packset; do
            cargo publish --locked --no-verify -p "$p"
          done
