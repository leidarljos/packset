name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Rust formatting
        run: cargo fmt --all --check
      # The two projections are excluded for the same reason they are separate
      # crates: each carries a native dependency with a download behind it, and
      # neither is needed to build or run the writer.
      - name: Clippy
        run: cargo clippy --locked --workspace --exclude packset-milli --exclude packset-embed --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --locked --workspace --exclude packset-milli --exclude packset-embed --no-fail-fast

  lifecycle:
    name: the daemon comes up and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build
        run: cargo build --locked --release -p packset
      # The unit tests cover the writer; this covers the seat's own entry
      # point, which is the part that breaks unnoticed because no test calls it.
      - name: Start, ask, stop
        env:
          GROKINSIDE_HOME: ${{ runner.temp }}/pack
          PACKSET_PORT: "8791"
          PACKSET_WORKSPACE: ci
        run: |
          set -euo pipefail
          bin/packset ensure
          bin/packset status
          bin/packset accessions ci
          curl -fsS -X POST "http://127.0.0.1:8791/v1/atoms" \
            -H 'Content-Type: application/json' \
            -d '{"workspace":"ci","kind":"conclusion","text":"The lifecycle check passed.","entities":["deed-ci-smoke"]}' >/dev/null
          test "$(bin/packset accessions ci)" = "deed-ci-smoke"
          # Both directions of the join, over the pack that just answered.
          bin/packset citers deed-ci-smoke | grep -q "The lifecycle check passed."
          test -z "$(bin/packset citers deed-nothing-here)"
          test "$(bin/packset which)" = "$PWD/target/release/packsetd"
          bin/packset stop
          ! bin/packset status
