name: docs-deploy

on:
  workflow_run:
    # The job below refuses a run whose head is not this repository.
    workflows: ["docs"]
    types: [completed]

permissions:
  contents: read

# The github-pages environment allows the main branch only. This workflow
# runs on the default branch. It checks out the tag the docs workflow built
# and publishes that site. GitHub reads this file from the default branch.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      contains(github.event.workflow_run.head_branch, '.')
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo timeout -k 5 90 bash .github/scripts/apt-mirror.sh
      - run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get install -y --no-install-recommends pandoc ttf-mscorefonts-installer
      - run: bash docs/scripts/export_org_to_rst.sh
      - run: bash docs/scripts/render-og-png.sh
      - run: python -m pip install -q -r docs/requirements.txt
      - run: sphinx-build -b html -n -W docs/source docs/build
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Exit 2 on any finding the .impeccable config does not ignore.
      - run: npx -y impeccable@4.5.2 detect docs/build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      contains(github.event.workflow_run.head_branch, '.')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
