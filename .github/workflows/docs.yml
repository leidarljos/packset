name: docs

on:
  push:
    # A push to develop has no pull request, so the build and the checks
    # run on the push. Only a main ref uploads and deploys.
    branches: [main, develop]
    # Release tags publish the docs at that tag. Path filters are not
    # applied to tag pushes.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths: ["docs/**", ".github/workflows/docs.yml", ".impeccable/**"]
  # A pull request builds the docs and checks them; it never publishes.
  pull_request:
    branches: [main, develop]
    paths: ["docs/**", ".github/workflows/docs.yml", ".impeccable/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Main publishes on its push. A release tag builds and checks the docs
# here; docs-deploy.yml publishes that tag, since the github-pages
# environment allows main only and a workflow_run on the default branch
# checks out the tagged commit. Main has its own group, so no other run
# of this workflow can cancel a deploy.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('docs-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get install -y --no-install-recommends pandoc ttf-mscorefonts-installer
      - run: bash docs/scripts/export_org_to_rst.sh
      - run: bash docs/scripts/render-og-png.sh
      - run: python -m pip install -q -r docs/requirements.txt
      - run: sphinx-build -b html -n -W docs/source docs/build
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Exit 2 on any finding the .impeccable config does not ignore.
      - run: npx -y impeccable@4.5.2 detect docs/build
      # Only a main ref configures Pages and uploads the artifact. A
      # develop push, a pull request, a tag and a manual run on any other
      # ref build and check, then stop. A tag is published by
      # docs-deploy.yml, which uploads its own artifact. The deploy job
      # below is already main-only.
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: docs/build
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
