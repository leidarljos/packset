name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Builds the release for a tag that already exists, with this workflow and
  # this build script, and the tag's own source. The tag is not moved.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, such as v0.13.0"
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # ci.yml runs on a push to main or develop.
  # A tag does not start it.
  # A tag pushed with its commit can list no run for a moment.
  # Ten looks, two seconds apart, cover that gap.
  # After that the commit never started CI and the release stops.
  CI_LOOKS: "10"
  CI_LOOK_SECONDS: "2"

jobs:
  ci-green:
    name: CI on this sha is green
    runs-on: ubuntu-latest
    # The CI wait stops after 60 minutes.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: The tag names a release
        run: |
          set -eu
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: CI succeeded on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha=$(git rev-parse HEAD)
          # The newest run is the one that counts.
          # An older success does not cover a later failure.
          run_id=
          i=0
          while [ "$i" -lt "$CI_LOOKS" ]; do
            run_id=$(gh run list --commit "$sha" --workflow ci.yml --limit 1 \
              --json databaseId,status,conclusion --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then
              break
            fi
            i=$((i + 1))
            sleep "$CI_LOOK_SECONDS"
          done
          if [ -z "$run_id" ]; then
            echo "no CI run for $sha" >&2
            exit 1
          fi
          echo "CI run $run_id for $sha"
          gh run watch "$run_id" --exit-status

  build:
    needs: ci-green
    strategy:
      fail-fast: false
      matrix:
        # These are the hosts cargo binstall fetches.
        # The archive name is packset-$TAG-$target.
        # That name is the binstall pkg-url.
        include:
          # Ubuntu 22.04 is glibc 2.35. ubuntu-latest is newer, and a
          # binary built there does not run on a 22.04 machine.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: The tag names a release
        run: |
          set -eu
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
      # The build script, the version reader and the glibc check come from
      # the workflow's commit, so a fix to them applies when an older tag
      # is rebuilt. Ubuntu 22.04's python3 is 3.10 and has no tomllib.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: .release
          sparse-checkout: |
            crates/packset-embed/build-onnxruntime.sh
            scripts/workspace_version.py
            scripts/glibc-floor.sh
            .github/scripts/apt-mirror.sh
          sparse-checkout-cone-mode: false
      # The tag's v prefix is not part of the crate version. One runner reads
      # the manifest; the matrix builds that same tag.
      - name: The tag matches the crate version
        if: runner.os == 'Linux'
        run: |
          set -eu
          ver=$(python3 .release/scripts/workspace_version.py Cargo.toml)
          tag="${TAG#v}"
          if [ "$tag" != "$ver" ]; then
            echo "tag $TAG does not match crate version $ver" >&2
            exit 1
          fi
      - name: The runtime version the build script pins
        id: ortver
        run: |
          set -eu
          ver=$(sed -n 's/^version=//p' .release/crates/packset-embed/build-onnxruntime.sh)
          test -n "$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 2026-08-05
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: The target is installed for the pin
        run: rustup target list --installed | grep -qx '${{ matrix.target }}'
      # The mirror script comes from the workflow's commit, so a dark
      # archive.ubuntu.com on the runner does not fail an older tag rebuild.
      - name: Ubuntu apt mirror if the archive is dark
        if: runner.os == 'Linux'
        run: sudo bash .release/.github/scripts/apt-mirror.sh
      - name: Build tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends build-essential cmake python3 pkg-config libssl-dev
      # ONNX Runtime 1.28 stops when CMake is older than 3.28, and Ubuntu
      # 22.04's package is 3.22. The CMake 3.28.6 Linux binary needs glibc
      # 2.17, so it runs on this runner. It is a build tool and is not
      # linked into the archives. The runtime also wants the GNU Compiler
      # Collection at 11.1 or newer, which 22.04 has. Building the runtime
      # on this glibc is what holds packset-embed to GLIBC_2.35. On a newer
      # runner the C++ library takes newer symbols, which is how the encoder
      # came to need GLIBC_2.43.
      - name: CMake 3.28 or newer
        if: runner.os == 'Linux'
        run: |
          set -eu
          have=0
          if command -v cmake >/dev/null 2>&1; then
            have=$(cmake --version | awk 'NR==1 { print $3 }')
          fi
          lowest=$(printf '%s\n%s\n' "$have" 3.28 | sort -V | head -n 1)
          if [ "$lowest" = 3.28 ]; then
            cmake --version
            exit 0
          fi
          case "$(uname -m)" in
            x86_64)
              arch=x86_64
              sum=00fa84587f57da55a6ef110db341272080b764eff4fc1275847e35ad236c0ae1
              ;;
            aarch64)
              arch=aarch64
              sum=f91e8a6f3eec289b7f19e27a62fadcc33d8a7c8eff1dc1a99391485af4c03b75
              ;;
            *)
              echo "no CMake binary for $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/cmake.sh" \
            "https://github.com/Kitware/CMake/releases/download/v3.28.6/cmake-3.28.6-linux-${arch}.sh"
          echo "$sum  $RUNNER_TEMP/cmake.sh" | sha256sum -c -
          sudo bash "$RUNNER_TEMP/cmake.sh" --skip-license --prefix=/usr/local
          echo /usr/local/bin >> "$GITHUB_PATH"
          export PATH="/usr/local/bin:$PATH"
          hash -r
          command -v cmake
          cmake --version
      # packset-embed links ONNX Runtime and does not download one. The
      # release links it statically, so the encoder needs no library beside
      # it and an install that copies only the binaries still starts. The
      # script builds the shared library; its build tree holds the static
      # archives of every part, and the cache keeps only those.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: ort
        with:
          path: ${{ runner.temp }}/onnxruntime-static
          key: onnxruntime-${{ steps.ortver.outputs.version }}-cpu-static-${{ matrix.target }}-${{ hashFiles('.release/crates/packset-embed/build-onnxruntime.sh') }}
      - name: Build ONNX Runtime from source
        if: steps.ort.outputs.cache-hit != 'true'
        env:
          ORT_SRC: ${{ runner.temp }}/onnxruntime-src
        run: |
          set -eu
          # ONNX Runtime calls the aarch64 macOS slice arm64.
          # The arm64 runner builds that slice by default.
          # An x86_64 macOS target has to name its slice.
          # Otherwise the static archives are the host machine.
          case "${{ matrix.target }}" in
            x86_64-apple-darwin) export ORT_OSX_ARCH=x86_64 ;;
            aarch64-apple-darwin) export ORT_OSX_ARCH=arm64 ;;
          esac
          bash .release/crates/packset-embed/build-onnxruntime.sh "${{ runner.temp }}/onnxruntime"
          case "$RUNNER_OS" in
            macOS) build="$ORT_SRC/build/MacOS/Release" ;;
            *) build="$ORT_SRC/build/Linux/Release" ;;
          esac
          dest="${{ runner.temp }}/onnxruntime-static"
          (cd "$build" && find . -name '*.a' -type f) | while IFS= read -r a; do
            mkdir -p "$dest/$(dirname "$a")"
            cp "$build/$a" "$dest/$a"
          done
          test -f "$dest/libonnxruntime_common.a"
      - name: Build the writer
        run: cargo build --locked --release --target ${{ matrix.target }} -p packset
      # ort-sys links the archives it knows by name. ONNX Runtime 1.28 adds
      # model_package, which it does not name; a link argument comes last on
      # the command line, after the archives that call into it. pkg-config
      # stays out, so a shared runtime on the runner cannot win.
      - name: Build the encoder
        env:
          ORT_LIB_PATH: ${{ runner.temp }}/onnxruntime-static
          ORT_SKIP_DOWNLOAD: "1"
          LIBONNXRUNTIME_NO_PKG_CONFIG: "1"
        run: |
          set -eu
          extra="$ORT_LIB_PATH/model_package/libmodel_package.a"
          if [ -f "$extra" ]; then
            export RUSTFLAGS="-C link-arg=$extra"
          fi
          cargo build --locked --release --target ${{ matrix.target }} -p packset-embed
      # The floor is the glibc on the 22.04 runner. A newer GLIBC_ symbol
      # means the archive will not start on that release. packset-embed is
      # included: the Open Neural Network Exchange (ONNX) Runtime is built
      # from source on this runner, so it does not raise the floor.
      - name: glibc symbols stay at 2.35
        if: runner.os == 'Linux'
        run: |
          set -eu
          bash .release/scripts/glibc-floor.sh 2.35 \
            "target/${{ matrix.target }}/release/packset" \
            "target/${{ matrix.target }}/release/packsetd" \
            "target/${{ matrix.target }}/release/packset-mcp" \
            "target/${{ matrix.target }}/release/packset-embed"
      - name: Package
        run: |
          set -eu
          name="packset-${TAG}-${{ matrix.target }}"
          out="dist/$name"
          bin="target/${{ matrix.target }}/release"
          mkdir -p "$out"
          cp "$bin/packset" "$bin/packsetd" "$bin/packset-mcp" "$bin/packset-embed" "$out/"
          # The encoder must not name a shared ONNX Runtime.
          if [ "$RUNNER_OS" = macOS ]; then
            otool -L "$out/packset-embed"
            if otool -L "$out/packset-embed" | grep -q onnxruntime; then
              echo "packset-embed links a shared ONNX Runtime" >&2
              exit 1
            fi
          else
            ldd "$out/packset-embed"
            if readelf -d "$out/packset-embed" | grep -q onnxruntime; then
              echo "packset-embed links a shared ONNX Runtime" >&2
              exit 1
            fi
          fi
          # The binaries are the matrix target.
          # That includes a macOS cross build.
          case "$RUNNER_OS" in
            macOS)
              case "${{ matrix.target }}" in
                x86_64-*) want=x86_64 ;;
                aarch64-*) want=arm64 ;;
              esac
              for b in packset packsetd packset-mcp packset-embed; do
                got=$(lipo -archs "$out/$b")
                test "$got" = "$want"
              done
              ;;
            *)
              case "${{ matrix.target }}" in
                x86_64-*) want=X86-64 ;;
                aarch64-*) want=AArch64 ;;
              esac
              for b in packset packsetd packset-mcp packset-embed; do
                readelf -h "$out/$b" | grep -q "$want"
              done
              ;;
          esac
          "$out/packset-embed" --help >/dev/null
          "$out/packset" --version
          cp README.md CHANGELOG.md LICENSE* "$out/" 2>/dev/null || true
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*
  release:
    needs: [ci-green, build]
    runs-on: ubuntu-latest
    # The release job writes the tag and its attestations.
    # `gh attestation verify` and the ljos installer check those attestations.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      # A signed statement that this workflow built each archive, which
      # `gh attestation verify` and the ljos installer check.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*.tar.gz
      - name: Release notes from the changelog
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## "v {p=1; next} /^## /{if(p) exit} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      # A release opened in the browser creates the tag, so it exists before
      # this job runs. Its notes stay; the tarballs are added to it.
      - name: Release the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber dist/*
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md dist/*
          fi
