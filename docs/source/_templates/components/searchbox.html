{%- if pathto('search') != '#' -%}
<form class="searchbox flex items-center" action="{{ pathto('search') }}" method="get" role="search">
  <label class="ll-clip" for="packset-search-q">{{ _('Search') }}</label>
  <input id="packset-search-q" type="text" name="q" placeholder="{{ _('Search') }}" />
  <kbd>/</kbd>
</form>
{%- endif -%}
