  <line x1="62" y1="108" x2="118" y2="108" stroke="#0B0B0A" stroke-width="4" stroke-linecap="round" opacity="0.28"/>
  <line x1="62" y1="128" x2="110" y2="128" stroke="#0B0B0A" stroke-width="4" stroke-linecap="round" opacity="0.28"/>
  <!-- pin through both -->
  <circle cx="72" cy="68" r="8" fill="#E6A23C"/>
