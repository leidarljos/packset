[project]
name = "packset"
version = "0.1.0"
description = "Seat-pack daemon: one writer, HTTP clients"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
tui = ["textual>=0.86"]

[project.scripts]
packset-tui = "packset_tui.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packset_tui"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["scripts"]
pythonpath = ["scripts", "."]
python_files = ["test_*.py"]
addopts = ["-q", "--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["scripts", "packset_tui"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
