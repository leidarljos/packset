[workspace]
resolver = "2"
members = [
    "crates/packset-core",
    "crates/packset-client",
    "crates/packset-milli",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
